name = "loghog"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "72f8d3b84babd88667f79a241a520ec3"

[assets]
directory = "./pages"
binding = "ASSETS"
# Only the pages with a reviews section go through the Worker first;
# everything else (images, CSS, contact page) is served straight from assets.
run_worker_first = ["/", "/index.html", "/about-us", "/about-us/", "/about-us.html"]

[vars]
# Optional: Google Place ID for Log Hog. Leave empty to look it up by name.
GOOGLE_PLACE_ID = ""

# Secret (not stored here): npx wrangler secret put GOOGLE_PLACES_API_KEY
